name: build-windows

# GitHub 的 windows-latest 只有 2 核 7 GB，默认并行度会在链接阶段把内存打穿
# （表现为 ninja 中途被杀、无报错、退出码 127）。这里把 build.sh 里的 ninja 固定成 -j2，
# 并用 -g0 去掉调试信息降低单 TU 内存占用。
#
# 注意：不要用 shell 包装脚本替代 ninja —— CMake 会直接执行 `ninja --version` 探测编译器，
# 包装脚本会报 "inappropriate file type or format"。

on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      # 必须在 checkout 之前：否则子模块被 checkout 成 CRLF，而补丁是 LF，git apply 会失败
      - name: 关闭 CRLF 转换
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 归一化行尾
        shell: bash
        run: |
          sed -i 's/\r$//' gpu/patches/fsr-vulkan/*.patch
          find gpu/third_party/fsr-vulkan -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i 's/\r$//' {} +

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bbport-${{ hashFiles('gpu/CMakeLists.txt', 'gpu/bbnet/**', 'patches/**') }}
          max-size: 2G

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch zip unzip python
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: 编译
        shell: msys2 {0}
        run: |
          git config --global core.autocrlf false
          export BB_GPU_TARGETS=bb-probe
          sed -i 's|ninja -C out/gpu|ninja -j2 -C out/gpu|' build.sh
          grep -n "ninja -j2" build.sh
          # 进程若被 OOM / 磁盘耗尽杀掉，后面的 trap 和 if 都不会执行，只能靠后台采样留证据。
          ( while true; do date; df -h . | tail -1; head -3 /proc/meminfo; sleep 15; done ) > monitor.log 2>&1 &
          MON=$!
          cmake -S gpu -B out/gpu -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g0" \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g0" > /dev/null
          # tee 让输出实时进 Actions 日志：重定向到文件是全缓冲的，进程被硬杀时缓冲区里
          # 的最后几十行会整体丢失，这正是之前每次只能看到 "+ cp" 的原因。
          bash -x build.sh 2>&1 | tee build-trace.txt
          rc=${PIPESTATUS[0]}
          kill $MON 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "=== build.sh rc=$rc ==="
            echo "--- 磁盘 ---"; df -h . 2>/dev/null | tail -2
            echo "--- 内存 ---"; head -3 /proc/meminfo 2>/dev/null || true
            echo "--- 监控尾部 ---"; tail -12 monitor.log 2>/dev/null || true
            echo "--- trace 尾部 ---"; tail -25 build-trace.txt
            echo "--- gpu-build.log 尾部 ---"; tail -25 out/gpu-build.log 2>/dev/null || true
            echo "--- 产物 ---"; ls -l out/gpu/*.exe 2>/dev/null || true
          fi
          exit $rc

      - name: 诊断（总是执行）
        if: always()
        shell: msys2 {0}
        run: |
          echo "--- exe 产物 ---"; ls -l out/gpu/*.exe out/*.exe 2>&1 || true
          echo "--- cp 身份 ---"; type -a cp 2>&1; cp --version 2>&1 | head -1
          echo "--- out 目录 ---"; ls -ld out 2>&1; echo "PWD=$PWD"
          echo "--- 磁盘 ---"; df -h . 2>&1 | tail -2
          echo "--- 内存 ---"; head -3 /proc/meminfo 2>&1 || true
          echo "--- 监控尾部 ---"; tail -20 monitor.log 2>/dev/null || echo "无 monitor.log"
          echo "--- trace 尾部 ---"; tail -15 build-trace.txt 2>/dev/null || echo "无 trace"

      - name: 诊断 cp（裸环境）
        if: always()
        shell: msys2 {0}
        run: |
          echo "PWD=$PWD"
          time cp out/gpu/bb-probe.exe out/bare-probe.exe 2>&1 && echo "BARE_OK" || echo "BARE_FAIL rc=$?"
          ls -l out/bare-probe.exe 2>&1 || true

      - name: 诊断 cp（source msys2-env.sh 之后）
        if: always()
        shell: msys2 {0}
        run: |
          source ./msys2-env.sh
          echo "PATH=$PATH"
          time cp out/gpu/bb-probe.exe out/env-probe.exe 2>&1 && echo "ENV_OK" || echo "ENV_FAIL rc=$?"
          ls -l out/env-probe.exe 2>&1 || true

      - name: 组装运行时（exe + 递归依赖的 DLL）
        shell: msys2 {0}
        run: python tools/collect-runtime.py --exe out/gpu/bb-probe.exe --out dist/runtime.zip

      - name: 失败时导出日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-trace.txt
            out/gpu-build.log
            monitor.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bbport-runtime
          path: dist/runtime.zip
          if-no-files-found: error
          retention-days: 14
