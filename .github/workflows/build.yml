name: build-windows

# windows-latest 实测 4 vCPU / 16 GB：并行度用 nproc 自适应，不写死 -j2。
# 用 -g0 去掉调试信息，降低单 TU 的内存占用与产物体积。
#
# CI 上 C://msys64 是镜像预装的旧版 MSYS2，build.sh 会 source msys2-env.sh 把它的 usr/bin
# 插到 PATH 最前，导致 cp 等 coreutils exec 失败并返回 127。这里用 MSYS2_ROOT 指向不存在的
# 路径让它跳过注入；setup-msys2 的工具链本来就在 PATH 里。
#
# 注意：不要用 shell 包装脚本替代 ninja —— CMake 会直接执行 `ninja --version` 探测编译器，
# 包装脚本会报 "inappropriate file type or format"。

on:
  push:
    branches:
      - windows        # 默认分支即发布主线
      - 'ci/**'
      - 'feat/**'
      - 'fix/**'
    # 纯文档改动不必占用一次完整构建
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 同一分支连推多次时取消上一轮，避免排队跑没人看的结果
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      # 必须在 checkout 之前：否则子模块被 checkout 成 CRLF，而补丁是 LF，git apply 会失败
      - name: 关闭 CRLF 转换
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 归一化行尾
        shell: bash
        run: |
          sed -i 's/\r$//' gpu/patches/fsr-vulkan/*.patch
          find gpu/third_party/fsr-vulkan -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i 's/\r$//' {} +

      # 合并上游时最容易出的错，是冲突解决成上游那一侧：更新通道悄悄退回官方仓库。本仓库的改动全部住在
      # launcher/bbport_fork.py（merge 不会碰它），但调用点仍在 bbport_launcher_win.py，所以这里一秒内
      # 把回退挡掉，而不是等到玩家点了「更新」装回官方版才发现。
      - name: 更新通道仍指向本仓库
        shell: bash
        run: |
          test -f launcher/bbport_fork.py || { echo "launcher/bbport_fork.py 丢了" >&2; exit 1; }
          grep -q "REPOSITORY = 'Moodow/bloodborne_pc'" launcher/bbport_fork.py \
            || { echo "bbport_fork.REPOSITORY 不再指向本仓库" >&2; exit 1; }
          grep -Eq '^FORK_REV = [1-9][0-9]*$' launcher/bbport_fork.py \
            || { echo "FORK_REV 丢了、被改成 0，或不再是纯数字" >&2; exit 1; }
          grep -q "import bbport_fork as forked" launcher/bbport_launcher_win.py \
            || { echo "启动器不再引用 bbport_fork" >&2; exit 1; }
          if grep -q "Supermedo/bloodborne_pc" launcher/bbport_launcher_win.py; then
            echo "更新通道退回上游：launcher/bbport_launcher_win.py 里还有 Supermedo/bloodborne_pc" >&2
            exit 1
          fi

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          # 保留全量更新：去掉后实测 156s，反而比保留时的 109s 更慢（缓存 key 会变，
          # 且 base 与包版本可能错配——症状就是本次耗时排查的 cp/exec 返回 127）。
          update: true
          install: >-
            git patch zip unzip python
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: 编译
        shell: msys2 {0}
        run: |
          git config --global core.autocrlf false
          export BB_GPU_TARGETS=bb-probe
          # CI 上 C:/msys64 是 runner 预装的旧版 MSYS2。build.sh 会 source msys2-env.sh，
          # 那里把 $msys2_root/usr/bin 插到 PATH 最前面，于是 cp 等 coreutils 解析到旧版
          # 二进制，与当前 bash 已映射的新版 msys-2.0.dll 不符，exec 失败后 bash 报 127。
          # 指向不存在的路径让脚本自行跳过 PATH 注入——setup-msys2 的工具链本来就在 PATH 里。
          export MSYS2_ROOT=/nonexistent-msys2
          # 实测 -j2 编译 378s，-j4 反而 573s（4 vCPU 是 2 物理核 + 超线程，编译密集型
          # 负载下超线程争抢严重）。保持 -j2。
          sed -i 's|ninja -C out/gpu|ninja -j2 -C out/gpu|' build.sh
          grep -n "ninja -j" build.sh
          echo "可用核心: $(nproc)"
          # 进程若被 OOM / 磁盘耗尽杀掉，后面的 trap 和 if 都不会执行，只能靠后台采样留证据。
          ( while true; do date; df -h . | tail -1; head -3 /proc/meminfo; sleep 15; done ) > monitor.log 2>&1 &
          MON=$!
          cmake -S gpu -B out/gpu -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g0" \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O2 -g0" > /dev/null
          # tee 让输出实时进 Actions 日志：重定向到文件是全缓冲的，进程被硬杀时缓冲区里
          # 的最后几十行会整体丢失，这正是之前每次只能看到 "+ cp" 的原因。
          bash -x build.sh 2>&1 | tee build-trace.txt
          rc=${PIPESTATUS[0]}
          kill $MON 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "=== build.sh rc=$rc ==="
            echo "--- 磁盘 ---"; df -h . 2>/dev/null | tail -2
            echo "--- 内存 ---"; head -3 /proc/meminfo 2>/dev/null || true
            echo "--- 监控尾部 ---"; tail -12 monitor.log 2>/dev/null || true
            echo "--- trace 尾部 ---"; tail -25 build-trace.txt
            echo "--- gpu-build.log 尾部 ---"; tail -25 out/gpu-build.log 2>/dev/null || true
            echo "--- 产物 ---"; ls -l out/gpu/*.exe 2>/dev/null || true
          fi
          exit $rc

      - name: 组装运行时（exe + 递归依赖的 DLL）
        shell: msys2 {0}
        env:
          # MSYS2 的 Python 在 Windows 上默认按 cp1252 输出，脚本里的中文提示会抛
          # UnicodeEncodeError: 'charmap' codec can't encode。
          PYTHONUTF8: "1"
        run: python tools/collect-runtime.py --exe out/gpu/bb-probe.exe --out dist/runtime.zip

      - name: 失败时导出日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-trace.txt
            out/gpu-build.log
            monitor.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bbport-runtime
          path: dist/runtime.zip
          if-no-files-found: error
          retention-days: 14
